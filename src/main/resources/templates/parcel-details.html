
<!DOCTYPE html>
<html lang="kk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сәлемдеме мәліметтері — QAZPOST</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #1d2939;
        }
        header {
            background: #c8102e;
            color: white;
            padding: 22px 8%;
        }
        header a { color: white; text-decoration: none; font-weight: bold; }
        main { max-width: 850px; margin: 40px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 22px;
            box-shadow: 0 5px 20px #1018280b;
        }
        h1 { margin-top: 0; }
        .tracking { color: #c8102e; font-size: 24px; font-weight: bold; }
        .status {
            display: inline-block;
            background: #fff0d2;
            color: #875700;
            padding: 8px 13px;
            border-radius: 20px;
        }
        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .label { color: #667085; font-size: 13px; margin-bottom: 7px; }
        .value { font-weight: bold; }
        .event {
            border-left: 3px solid #c8102e;
            padding: 5px 0 20px 18px;
            margin-left: 5px;
        }
        .event:last-child { padding-bottom: 0; }
        .back {
            display: inline-block;
            margin-top: 8px;
            background: #c8102e;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 7px;
        }
        footer { text-align: center; padding: 25px; color: #667085; }
    </style>
</head>
<body>
<header>
    <a href="/">QAZPOST | Сәлемдеме трекингі</a>
</header>

<main>
    <section class="card">
        <h1>Сәлемдеме мәліметтері</h1>
        <div class="label">Трек-нөмір</div>
        <div class="tracking" th:text="${parcel.trackingNumber}">KZ100001</div>
        <p>
            <span class="status" th:text="${parcel.status}">Қабылданды</span>
        </p>
    </section>

    <section class="card">
        <h2>Жеткізу ақпараты</h2>
        <div class="details">
            <div>
                <div class="label">Жіберуші</div>
                <div class="value" th:text="${parcel.senderName}">Айжан</div>
            </div>
            <div>
                <div class="label">Алушы</div>
                <div class="value" th:text="${parcel.recipientName}">Аружан</div>
            </div>
            <div>
                <div class="label">Қай қаладан</div>
                <div class="value" th:text="${parcel.senderCity}">Алматы</div>
            </div>
            <div>
                <div class="label">Қай қалаға</div>
                <div class="value" th:text="${parcel.recipientCity}">Астана</div>
            </div>
            <div>
                <div class="label">Тіркелген уақыты</div>
                <div class="value" th:text="${#temporals.format(parcel.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
            </div>
        </div>
    </section>

    <section class="card">
        <h2>Жеткізу тарихы</h2>
        <div th:if="${history != null and !history.isEmpty()}">
            <div class="event" th:each="event : ${history}">
                <span th:text="${event}"></span>
            </div>
        </div>
        <p th:if="${history == null or history.isEmpty()}">
            Жеткізу тарихы әзірге жоқ.
        </p>
    </section>

    <a class="back" href="/">← Басты бетке қайту</a>
</main>

<footer>QazPost Parcel Tracking · Оқу жобасы</footer>
</body>
</html>
