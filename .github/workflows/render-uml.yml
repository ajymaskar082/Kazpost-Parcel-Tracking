name: Render UML diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/uml/*.puml'
      - '.github/workflows/render-uml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-uml:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz fonts-dejavu-core

      - name: Inspect PlantUML sources
        run: |
          echo "Repository: $GITHUB_WORKSPACE"
          find docs/uml -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          for file in docs/uml/*.puml; do
            echo "---- $file"
            sed -n '1,5p' "$file"
            grep -n '@startuml\|@enduml' "$file" || true
          done
          plantuml -version

      - name: Render PlantUML files individually
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/uml/*.puml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .puml source files found under docs/uml"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Rendering $file"
            plantuml -charset UTF-8 -tpng "$file"
          done

      - name: Commit updated PNG diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uml/*.png
          if git diff --cached --quiet; then
            echo "PNG files are already up to date."
            exit 0
          fi
          git commit -m "Regenerate UML PNG diagrams from PlantUML sources"
          git push
