name: Render UML diagrams

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'docs/uml/*.puml'
      - '.github/workflows/render-uml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-uml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-uml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz fonts-dejavu-core

      - name: Render PlantUML files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/uml/*.puml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .puml files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Rendering $file"
            plantuml -charset UTF-8 -tpng "$file"
          done

      - name: Upload rendered PNG diagrams
        uses: actions/upload-artifact@v4
        with:
          name: uml-png-diagrams
          path: docs/uml/*.png
          if-no-files-found: error
          retention-days: 30
