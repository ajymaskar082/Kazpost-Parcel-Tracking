name: Render UML diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/uml/*.puml'
      - '.github/workflows/render-uml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-uml:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz fonts-dejavu-core

      - name: Render all PlantUML source files to PNG
        run: |
          plantuml -tpng -charset UTF-8 docs/uml/*.puml

      - name: Commit updated PNG diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/uml/*.png
          if git diff --cached --quiet; then
            echo "PNG files are already up to date."
            exit 0
          fi
          git commit -m "Regenerate UML PNG diagrams from PlantUML sources"
          git push
